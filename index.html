<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadow Scripting executo key stage 2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 2.5rem;
      color: #b084ff;
    }

    p {
      font-size: 1.1rem;
      margin: 20px;
    }

    .buttons {
      margin-top: 30px;
    }

    .button {
      background-color: #8b5cf6;
      border: none;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .button:hover:enabled {
      background-color: #7c3aed;
    }
  </style>
</head>
<body>

  <h1>KEY FOR EXECUTOR LAST STAGE</h1>
  <p>Thank you for checking out the Shadow Scripting channel!</p>
  <p>Subscribe and watch the video to access your key.</p>

  <div class="buttons">
    <!-- Subscribe Button -->
    <a class="button" href="https://www.youtube.com/@shadow-scripting?sub_confirmation=1" target="_blank" onclick="taskDone('subscribe')">
      Subscribe to Shadow Scripting
    </a>

    <!-- Watch Video Button -->
    <a class="button" href="https://www.youtube.com/watch?v=QpIMflqoatE" target="_blank" onclick="taskDone('watch')">
      Watch Video
    </a>

    <!-- Complete Task Button (Initially Disabled) -->
    <button id="completeTaskBtn" class="button" disabled onclick="completeTask()">Complete Task</button>
  </div>

  <script>
    let subscribed = false;
    let watched = false;

    function taskDone(task) {
      if (task === 'subscribe') subscribed = true;
      if (task === 'watch') watched = true;

      // If both tasks are done, enable the button
      if (subscribed && watched) {
        document.getElementById('completeTaskBtn').disabled = false;
      }
    }

    function completeTask() {
      alert("Task Completed! Redirecting to your key...");
      window.location.href = "https://textboy-roblox-scripter.github.io/key-for-executor/";
    }
  </script>

</body>
</html>
